<section class="hero" id="home">
  <div class="container hero-container">
    <div class="hero-content">
      <div class="hero-badge reveal reveal-down">
        <i class="fa-solid fa-heart-pulse"></i>
        Trusted Healthcare Since 2005
      </div>

      <h1 class="reveal reveal-left">
        Your Health,
        <span>Our Priority.</span>
      </h1>

      <p class="hero-description reveal reveal-left delay-1">
        Compassionate care, experienced doctors, and advanced medical technology — all under one
        roof for you and your family.
      </p>

      <div class="hero-actions reveal reveal-up delay-2">
        <button class="primary-btn" (click)="scrollToAppointment()">
          Book Appointment
          <i class="fa-solid fa-arrow-right"></i>
        </button>

        <button class="secondary-btn" (click)="scrollToServices()">
          Explore Services
          <i class="fa-solid fa-arrow-down"></i>
        </button>
      </div>

      <div class="hero-trust reveal reveal-up delay-3">
        <div class="trust-item">
          <i class="fa-solid fa-circle-check"></i>
          <span>Experienced Doctors</span>
        </div>

        <div class="trust-item">
          <i class="fa-solid fa-circle-check"></i>
          <span>24/7 Emergency Care</span>
        </div>
      </div>
    </div>

    <div class="hero-visual reveal reveal-right">
      <div class="hero-image-wrapper">
        <div class="image-background"></div>

        <i class="fa-solid fa-stethoscope floating-icon icon-stethoscope"></i>

        <i class="fa-solid fa-syringe floating-icon icon-syringe"></i>

        <i class="fa-solid fa-pills floating-icon icon-pills"></i>

        <i class="fa-solid fa-heart-pulse floating-icon icon-heart"></i>

        <img
          src="assets/images/home_page_doctors.png"
          alt="MediCare Hospital Doctor"
          class="hero-image"
        />
      </div>
    </div>
  </div>

  <div class="container hero-stats">
    <div class="stat-item reveal reveal-up">
      <div class="stat-icon">
        <i class="fa-solid fa-user-doctor"></i>
      </div>

      <div>
        <strong>50+</strong>
        <span>Expert Doctors</span>
      </div>
    </div>

    <div class="stat-item reveal reveal-up delay-1">
      <div class="stat-icon">
        <i class="fa-solid fa-hospital"></i>
      </div>

      <div>
        <strong>15+</strong>
        <span>Departments</span>
      </div>
    </div>

    <div class="stat-item reveal reveal-up delay-2">
      <div class="stat-icon">
        <i class="fa-solid fa-users"></i>
      </div>

      <div>
        <strong>10K+</strong>
        <span>Patients Served</span>
      </div>
    </div>

    <div class="stat-item reveal reveal-up delay-3">
      <div class="stat-icon">
        <i class="fa-solid fa-clock"></i>
      </div>

      <div>
        <strong>24/7</strong>
        <span>Emergency Care</span>
      </div>
    </div>
  </div>
</section>
